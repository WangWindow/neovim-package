name: Package latest Neovim release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

concurrency:
  group: neovim-release-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Install workflow tools
        run: pacman -Syu --noconfirm --needed git curl jq github-cli dpkg

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find latest upstream release
        id: upstream
        run: |
          set -euo pipefail
          release_json=$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/neovim/neovim/releases/latest)

          tag=$(jq -r '.tag_name' <<<"$release_json")
          asset_url_x86_64=$(jq -r '
            .assets[]
            | select(.name == "nvim-linux-x86_64.tar.gz")
            | .browser_download_url
          ' <<<"$release_json")
          asset_url_arm64=$(jq -r '
            .assets[]
            | select(.name == "nvim-linux-arm64.tar.gz")
            | .browser_download_url
          ' <<<"$release_json")

          [[ -n $tag && $tag != null ]] || {
            echo 'Latest upstream release has no tag' >&2
            exit 1
          }
          [[ -n $asset_url_x86_64 && $asset_url_x86_64 != null ]] || {
            echo "Release $tag has no nvim-linux-x86_64.tar.gz asset" >&2
            exit 1
          }
          [[ -n $asset_url_arm64 && $asset_url_arm64 != null ]] || {
            echo "Release $tag has no nvim-linux-arm64.tar.gz asset" >&2
            exit 1
          }

          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
          echo "asset_url_x86_64=$asset_url_x86_64" >>"$GITHUB_OUTPUT"
          echo "asset_url_arm64=$asset_url_arm64" >>"$GITHUB_OUTPUT"

      - name: Check whether this version is already packaged
        id: existing
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)
          has_arch=false
          has_amd64_deb=false
          has_arm64_deb=false
          if grep -Eq '^neovim-bin-.*\.pkg\.tar\.zst$' <<<"$assets"; then
            has_arch=true
          fi
          if grep -Eq '^neovim-bin_.*_amd64\.deb$' <<<"$assets"; then
            has_amd64_deb=true
          fi
          if grep -Eq '^neovim-bin_.*_arm64\.deb$' <<<"$assets"; then
            has_arm64_deb=true
          fi
          if [[ $has_arch == true && $has_amd64_deb == true && $has_arm64_deb == true ]]; then
            echo "Version $TAG already has all package formats and architectures; nothing to do."
            echo 'should_build=false' >>"$GITHUB_OUTPUT"
          else
            echo 'should_build=true' >>"$GITHUB_OUTPUT"
          fi

      - name: Download official archives
        if: steps.existing.outputs.should_build == 'true'
        env:
          ASSET_URL_X86_64: ${{ steps.upstream.outputs.asset_url_x86_64 }}
          ASSET_URL_ARM64: ${{ steps.upstream.outputs.asset_url_arm64 }}
        run: |
          curl --fail-with-body --location --retry 3 \
            --output nvim-linux-x86_64.tar.gz "$ASSET_URL_X86_64"
          curl --fail-with-body --location --retry 3 \
            --output nvim-linux-arm64.tar.gz "$ASSET_URL_ARM64"

      - name: Build pacman package
        if: steps.existing.outputs.should_build == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- \
            "$GITHUB_WORKSPACE/scripts/build-package.sh" \
            "$VERSION" \
            "$GITHUB_WORKSPACE/nvim-linux-x86_64.tar.gz" \
            "$GITHUB_WORKSPACE/dist"

      - name: Build Debian packages
        if: steps.existing.outputs.should_build == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          "$GITHUB_WORKSPACE/scripts/build-deb-package.sh" \
            "$VERSION" \
            "$GITHUB_WORKSPACE/nvim-linux-x86_64.tar.gz" \
            "$GITHUB_WORKSPACE/dist"
          "$GITHUB_WORKSPACE/scripts/build-deb-package.sh" \
            "$VERSION" \
            "$GITHUB_WORKSPACE/nvim-linux-arm64.tar.gz" \
            "$GITHUB_WORKSPACE/dist"

      - name: Verify package metadata
        if: steps.existing.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          package=$(find dist -maxdepth 1 -type f -name 'neovim-bin-*.pkg.tar.zst' -print -quit)
          deb_amd64=$(find dist -maxdepth 1 -type f -name 'neovim-bin_*_amd64.deb' -print -quit)
          deb_arm64=$(find dist -maxdepth 1 -type f -name 'neovim-bin_*_arm64.deb' -print -quit)
          [[ -n $package ]]
          [[ -n $deb_amd64 ]]
          [[ -n $deb_arm64 ]]
          pacman -Qip "$package"
          dpkg-deb --info "$deb_amd64"
          dpkg-deb --info "$deb_arm64"
          [[ $(dpkg-deb --field "$deb_amd64" Architecture) == amd64 ]]
          [[ $(dpkg-deb --field "$deb_arm64" Architecture) == arm64 ]]

      - name: Publish package to this repository
        if: steps.existing.outputs.should_build == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(
            find dist -maxdepth 1 -type f \
              \( -name 'neovim-bin-*.pkg.tar.zst' -o -name 'neovim-bin_*.deb' \) \
              -print
          )
          (( ${#packages[@]} > 0 ))

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${packages[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${packages[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "Arch Linux x86_64 and Debian/Ubuntu amd64 and arm64 packages repacked from Neovim's official ${TAG} release archives."
          fi
